aid: markit
name: MarkIt
description: MarkIt is a Y Combinator (Fall 2025) startup based in Atlanta, GA building
  AI agents that automate international trade compliance workflows. The platform performs
  defensible HS and HTS tariff-code classification, OCR processing of shipping documents,
  tariff management, and customs issue resolution, with agents that work directly inside
  the tools trade professionals already use every day such as Excel, PDFs, and broker
  portals. MarkIt also publishes a free web-based HTS code classification tool at markittrade.com/hts.
  As of this enrichment pass MarkIt is an early-stage, landing-page-only product with no
  public developer API, SDK, documentation, or developer portal surface.
